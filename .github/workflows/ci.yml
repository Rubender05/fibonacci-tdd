name: CI/CD Pipeline - Fibonacci TDD

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: fibodb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Checkstyle (Code Quality)
        run: mvn checkstyle:check
        continue-on-error: true

      - name: Run Unit Tests
        run: mvn test -Dgroups="unit"
        env:
          SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb
          SPRING_DATASOURCE_USERNAME: sa
          SPRING_DATASOURCE_PASSWORD: 

      - name: Run Integration Tests
        run: mvn test -Dgroups="integration"
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/fibodb
          SPRING_DATASOURCE_USERNAME: admin
          SPRING_DATASOURCE_PASSWORD: password123

      - name: Run All Tests (Unit + Integration)
        run: mvn clean test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/fibodb
          SPRING_DATASOURCE_USERNAME: admin
          SPRING_DATASOURCE_PASSWORD: password123

      - name: Build Docker Image
        run: |
          docker build -t fibonacci-tdd:latest .
          docker tag fibonacci-tdd:latest fibonacci-tdd:${{ github.sha }}

      - name: Run Acceptance Tests
        run: mvn test -Dgroups="acceptance" -Dtest="*AcceptanceTest"
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/fibodb
          SPRING_DATASOURCE_USERNAME: admin
          SPRING_DATASOURCE_PASSWORD: password123
        continue-on-error: true

      - name: Generate Test Report
        if: always()
        run: |
          echo "Test Summary:"
          mvn surefire-report:report

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: target/surefire-reports/
